packages:
  - 'packages/apps/*'
  - 'packages/services/*'
  - 'packages/libs/*'
  - 'packages/infra/*'
overrides:
  '@smithy/types': '^4.19.0'
  '@smithy/core': '^3.38.1'
  react: '19.3.1'
  react-dom: '19.3.1'
  'minimatch@>=9 <11.0.1': '^11.0.4'
  'glob@>=9 <14.0.2': '^14.0.3'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  '@google/genai': true
  '@parcel/watcher': true
  msgpackr-extract: true
  protobufjs: true
