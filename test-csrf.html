<!DOCTYPE html>
<html>
<head>
    <title>CSRF Test</title>
</head>
<body>
    <h1>CSRF Token Test</h1>
    <button onclick="testCSRF()">Test CSRF Flow</button>
    <div id="results"></div>

    <script>
        async function testCSRF() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Testing CSRF Flow...</h2>';
            
            try {
                // Step 1: Fetch CSRF token
                results.innerHTML += '<p>1. Fetching CSRF token...</p>';
                const csrfResponse = await fetch('http://localhost:3000/api/csrf-token', {
                    credentials: 'include'
                });
                
                if (!csrfResponse.ok) {
                    throw new Error(`CSRF fetch failed: ${csrfResponse.status}`);
                }
                
                const csrfData = await csrfResponse.json();
                results.innerHTML += `<p>✅ CSRF Token received: ${csrfData.token.substring(0, 10)}...</p>`;
                
                // Step 2: Test a POST request with CSRF token
                results.innerHTML += '<p>2. Testing POST request with CSRF token...</p>';
                const testResponse = await fetch('http://localhost:3000/api/brands/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfData.token,
                        'Authorization': 'Bearer ' + localStorage.getItem('auth_token') || ''
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        name: 'Test Brand ' + Date.now(),
                        description: 'Test brand creation'
                    })
                });
                
                if (testResponse.status === 403) {
                    const error = await testResponse.json();
                    throw new Error(`CSRF validation failed: ${error.code || error.error}`);
                }
                
                if (testResponse.status === 401) {
                    results.innerHTML += '<p>⚠️ Authentication required - please login first</p>';
                } else if (testResponse.ok) {
                    const data = await testResponse.json();
                    results.innerHTML += '<p>✅ POST request successful!</p>';
                    results.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    results.innerHTML += `<p>❌ Request failed: ${testResponse.status}</p>`;
                }
                
            } catch (error) {
                results.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
