# Worktree Plus Configuration
version: "1.0"

# Default settings for worktrees
defaults:
  # Base directory for worktrees (relative to repository root)
  base_dir: ../worktrees

# Hooks that run after creating a worktree
hooks:
  post_create:
    # Always install dependencies after worktree creation.
    - type: command
      command: pnpm install

    # Quick visibility after worktree creation.
    - type: command
      command: wtp list

    # Root env file.
    - type: copy
      from: .env
      to: .env

    # Copy app env files from main worktree only when they exist.
    - type: command
      command: >-
        sh -lc 'for rel in
        packages/apps/api/.env
        packages/apps/assets-api/.env
        packages/apps/web/.env;
        do
          src="$GIT_WTP_REPO_ROOT/$rel";
          dst="$GIT_WTP_WORKTREE_PATH/$rel";
          if [ -f "$src" ]; then
            mkdir -p "$(dirname "$dst")";
            cp "$src" "$dst";
            echo "Copied $rel";
          else
            echo "Skipped missing $rel";
          fi;
        done'
