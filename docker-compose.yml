services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_assets:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postolio_assets_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_assets_18_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey, matching ElastiCache. The service keeps the name `redis`: same protocol and REDIS_* config.
  redis:
    image: valkey/valkey:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - valkey_8_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  # Versioned: a new Postgres major cannot open an older data directory.
  postgres_18_data:
  postgres_assets_18_data:
  valkey_8_data:
