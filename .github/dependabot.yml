version: 2
updates:
  # ============================================
  # GitHub Actions
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # ============================================
  # Root package (monorepo dependencies)
  # ============================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "monorepo"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Ignore major version updates for critical dependencies
      - dependency-name: "turbo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ============================================
  # API Application
  # ============================================
  - package-ecosystem: "npm"
    directory: "/packages/apps/api"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "api"
    commit-message:
      prefix: "chore(api)"
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      fastify:
        patterns:
          - "fastify*"
          - "@fastify/*"

  # ============================================
  # Web Application
  # ============================================
  - package-ecosystem: "npm"
    directory: "/packages/apps/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "web"
    commit-message:
      prefix: "chore(web)"
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"

  # ============================================
  # Infrastructure (CDK)
  # ============================================
  - package-ecosystem: "npm"
    directory: "/packages/infra/cdk"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "infrastructure"
      - "cdk"
    commit-message:
      prefix: "chore(infra)"
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
    allow:
      # Only allow updates from AWS for CDK packages
      - dependency-name: "aws-cdk*"
      - dependency-name: "@aws-cdk/*"

  # ============================================
  # Token Service
  # ============================================
  - package-ecosystem: "npm"
    directory: "/packages/services/token-service"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
      - "token-service"
      - "microservice"
    commit-message:
      prefix: "chore(token-service)"

  # ============================================
  # Publisher Service
  # ============================================
  - package-ecosystem: "npm"
    directory: "/packages/services/publisher"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
      - "publisher"
      - "microservice"
    commit-message:
      prefix: "chore(publisher)"

  # ============================================
  # Other Microservices (grouped)
  # ============================================
  - package-ecosystem: "npm"
    directory: "/packages/services/retry-handler"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "microservice"
    commit-message:
      prefix: "chore(retry-handler)"

  - package-ecosystem: "npm"
    directory: "/packages/services/dlq-processor"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "microservice"
    commit-message:
      prefix: "chore(dlq-processor)"

  - package-ecosystem: "npm"
    directory: "/packages/services/schedule-management"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "microservice"
    commit-message:
      prefix: "chore(schedule-mgmt)"

  - package-ecosystem: "npm"
    directory: "/packages/services/schedule-cleanup"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "microservice"
    commit-message:
      prefix: "chore(schedule-cleanup)"

  - package-ecosystem: "npm"
    directory: "/packages/services/status-sync"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "microservice"
    commit-message:
      prefix: "chore(status-sync)"

  # ============================================
  # Shared Libraries
  # ============================================
  - package-ecosystem: "npm"
    directory: "/packages/libs"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "04:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
      - "libs"
      - "shared"
    commit-message:
      prefix: "chore(libs)"

# Security updates are handled separately with higher priority
# They are enabled by default and will create PRs immediately