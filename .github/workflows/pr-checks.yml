name: PR Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read

env:
  NODE_VERSION: '26'
  CI: 'true'
  VITE_API_BASE_URL: http://127.0.0.1:65434
  VITE_GOOGLE_CLIENT_ID: test-client-id
  VITE_FACEBOOK_APP_ID: test-app-id

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm prettier --check '**/*.{ts,tsx,md}' --ignore-path .gitignore

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postolio_assets_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ASSETS_DATABASE_URL: postgresql://test:test@localhost:5432/postolio_assets_test
      ASSETS_S3_BUCKET: test-bucket
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @postolio/database-assets exec prisma migrate deploy
      - run: pnpm --filter @postolio/assets-api test:integration

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @postolio/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @postolio/web exec playwright test --reporter=list
      - run: pnpm --filter @postolio/web exec playwright test --config playwright.screenshots.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: packages/apps/web/test-results
          retention-days: 7

  infra-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Synthesize stacks and run cdk-nag
        working-directory: packages/infra/cdk
        # Runs the app directly: no AWS credentials or lookups, and a nag failure fails the job.
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: us-east-1
        run: pnpm exec ts-node --prefer-ts-exts bin/app.ts

  container-images:
    name: Container Image (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - packages/apps/api/Dockerfile
          - packages/apps/assets-api/Dockerfile
          - packages/apps/web/Dockerfile
          - packages/services/analytics-ingestor/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.dockerfile }} -t image-under-test .
      - name: Serve the SPA from the web image
        if: matrix.dockerfile == 'packages/apps/web/Dockerfile'
        run: |
          docker network create smoke
          docker run -d --name web --network smoke -p 8080:80 image-under-test
          sleep 3
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8080/dashboard | grep -q 'id="root"'
          # The /assets route must not collide with the dist/assets bundle folder.
          curl -fsS http://127.0.0.1:8080/assets | grep -q 'id="root"'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Reject private workstation and authentication artifacts
        run: node scripts/check-private-artifacts.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Scan the proposed source tree for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/source-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-scan"
          docker run --rm -v "$RUNNER_TEMP/source-scan:/source:ro" \
            zricethezav/gitleaks:v8.30.1 dir /source --redact=100 --no-banner
