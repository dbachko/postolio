name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  issues: write
  statuses: write
  actions: read

env:
  NODE_VERSION: '22'
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  DATA_DELETION_RECOVERY_MINUTES: ${{ vars.DATA_DELETION_RECOVERY_MINUTES }}

jobs:
  # ============================================
  # Detect what changed
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api: packages/apps/api/**
            web:
              - packages/apps/web/**
              - packages/libs/**
            token-service: packages/services/token-service/**
            publisher: packages/services/publisher/**
            retry-handler: packages/services/retry-handler/**
            dlq-processor: packages/services/dlq-processor/**
            schedule-management: packages/services/schedule-management/**
            schedule-cleanup: packages/services/schedule-cleanup/**
            status-sync: packages/services/status-sync/**
            infra: packages/infra/**
            libs: packages/libs/**

  # ============================================
  # Code Quality Checks
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git references
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter=@postolio/database build
          pnpm --filter=@postolio/database-assets build

      - name: Run linting
        run: npx turbo lint --filter='...[origin/${{ github.base_ref }}]'

      - name: Run type checking
        run: |
          # Try typecheck first, fallback to build if not available
          npx turbo typecheck --filter='...[origin/${{ github.base_ref }}]' || \
          npx turbo build --filter='...[origin/${{ github.base_ref }}]'

      - name: Check formatting
        run: |
          # Determine changed files against the PR base branch
          BASE_REF=origin/${{ github.base_ref }}
          # List added/modified/copied/renamed files and filter for Prettier-supported patterns
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR ${BASE_REF}...HEAD | grep -E '\\.(ts|tsx|md)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant changed files for Prettier. Skipping."
            exit 0
          fi

          echo "Running Prettier check on changed files:"
          echo "$CHANGED_FILES" | sed 's/^/- /'

          # Run Prettier check only on the changed files
          pnpm prettier --check $CHANGED_FILES --ignore-path .gitignore

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git references
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter=@postolio/database build
          pnpm --filter=@postolio/database-assets build

      - name: Run tests with coverage
        run: npx turbo test --filter='...[origin/${{ github.base_ref }}]'

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

  # ============================================
  # Build Validation
  # ============================================
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: |
          case "${{ matrix.package }}" in
            api)
              npx turbo build --filter=api
              ;;
            web)
              npx turbo build --filter=@postolio/web
              ;;
            infra)
              npx turbo build --filter=postolio-infrastructure
              ;;
            libs)
              # Build all lib packages
              npx turbo build --filter="./packages/libs/*"
              ;;
            token-service|publisher|retry-handler|dlq-processor|schedule-management|schedule-cleanup|status-sync)
              npx turbo build --filter="@postolio/${{ matrix.package }}"
              ;;
            *)
              echo "Unknown package: ${{ matrix.package }}"
              exit 1
              ;;
          esac

  # ============================================
  # Security Scanning
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: 'v0.68.2'
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Don't fail the build on vulnerabilities

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        continue-on-error: true # Don't fail if upload doesn't work
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
          wait-for-processing: false

      - name: Display Trivy Results Summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.sarif ]; then
            echo "✅ Security scan completed. Results uploaded to Security tab." >> $GITHUB_STEP_SUMMARY
            # Parse and display summary of findings
            jq -r '.runs[0].results | length' trivy-results.sarif > /dev/null 2>&1 && \
            echo "Found $(jq -r '.runs[0].results | length' trivy-results.sarif) security issues" >> $GITHUB_STEP_SUMMARY || \
            echo "Scan completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Security scan results not available" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # CDK Diff
  # ============================================
  cdk-diff:
    name: CDK Diff
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'infrastructure') || contains(github.event.pull_request.files.*.filename, 'packages/infra')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install CDK dependencies
        working-directory: packages/infra/cdk
        run: pnpm install --frozen-lockfile

      - name: Run CDK diff
        working-directory: packages/infra/cdk
        run: |
          echo "## CDK Stack Changes" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pnpm cdk diff --all --context environment=dev >> $GITHUB_STEP_SUMMARY 2>&1
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # PR Summary
  # ============================================
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, build-validation, security-scan]
    if: always()

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = `
            ## 📊 PR Check Summary

            | Check | Status |
            |-------|--------|
            | Code Quality | ${{ needs.code-quality.result }} |
            | Unit Tests | ${{ needs.unit-tests.result }} |
            | Build Validation | ${{ needs.build-validation.result }} |
            | Security Scan | ${{ needs.security-scan.result }} |

            ---
            *Generated at: ${new Date().toISOString()}*
            `;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('PR Check Summary')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }
