# .github/workflows/deploy-content-scheduler.yml
name: Deploy Content Scheduler

on:
  push:
    branches:
      - main
    paths:
      - 'packages/services/schedule-management/**'
      - 'packages/services/schedule-cleanup/**'
      - 'packages/services/retry-handler/**'
      - 'packages/libs/**'
      - '.github/workflows/deploy-content-scheduler.yml'

jobs:
  deploy-content-scheduler:
    name: Deploy Content Scheduler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Content Scheduler
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
        run: |
          pnpm --filter="@postolio/schedule-management" deploy
          pnpm --filter="@postolio/schedule-cleanup" deploy
          pnpm --filter="@postolio/retry-handler" deploy
