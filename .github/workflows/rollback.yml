name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      service:
        description: 'Service to rollback (or "all")'
        required: true
        type: choice
        options:
          - all
          - api
          - web
          - token-service
          - publisher
          - retry-handler
          - dlq-processor
          - schedule-management
          - schedule-cleanup
          - status-sync
      version:
        description: 'Version/tag to rollback to (e.g., prod-abc123 or previous)'
        required: true
        default: 'previous'

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  # ============================================
  # Rollback Service
  # ============================================
  rollback:
    name: Rollback ${{ github.event.inputs.service }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine rollback version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" == "previous" ]]; then
            # Get the previous version from ECR
            if [[ "${{ github.event.inputs.service }}" == "api" || "${{ github.event.inputs.service }}" == "web" ]]; then
              # For containerized services, get previous image
              IMAGES=$(aws ecr describe-images \
                --repository-name postolio-${{ github.event.inputs.service }} \
                --query 'sort_by(imageDetails,& imagePushedAt)[-2].imageTags[0]' \
                --output text)
              echo "version=$IMAGES" >> $GITHUB_OUTPUT
            else
              # For Lambda services, get previous version
              FUNCTION_NAME="postolio-${{ github.event.inputs.environment }}-${{ github.event.inputs.service }}"
              PREV_VERSION=$(aws lambda list-versions-by-function \
                --function-name $FUNCTION_NAME \
                --query 'Versions[-2].Version' \
                --output text)
              echo "version=$PREV_VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Rollback API service
        if: github.event.inputs.service == 'api' || github.event.inputs.service == 'all'
        run: |
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name "Postolio-${{ github.event.inputs.environment }}" \
            --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" \
            --output text)
          
          SERVICE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "Postolio-${{ github.event.inputs.environment }}" \
            --query "Stacks[0].Outputs[?OutputKey=='EcsServiceName'].OutputValue" \
            --output text)
          
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query "services[0].taskDefinition" \
            --output text)
          
          # Update task definition with rollback image
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION")
          
          # Update the image in the task definition
          NEW_IMAGE="${{ steps.login-ecr.outputs.registry }}/postolio-api:${{ steps.version.outputs.version }}"
          
          echo "$TASK_DEF_JSON" | \
            jq --arg IMAGE "$NEW_IMAGE" '.taskDefinition | .containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' | \
            aws ecs register-task-definition --cli-input-json file:///dev/stdin
          
          # Update service with new task definition
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$TASK_DEFINITION"
          
          # Wait for rollback to complete
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME"
          
          echo "✅ API service rolled back to version: ${{ steps.version.outputs.version }}"

      - name: Rollback Web frontend
        if: github.event.inputs.service == 'web' || github.event.inputs.service == 'all'
        run: |
          # For web frontend, we need to restore S3 content from a previous version
          # This assumes you have versioning enabled on your S3 bucket
          
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "Postolio-${{ github.event.inputs.environment }}" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          
          if [[ "${{ github.event.inputs.version }}" == "previous" ]]; then
            # List object versions and restore previous version
            aws s3api list-object-versions \
              --bucket "$BUCKET_NAME" \
              --prefix "" \
              --query 'Versions[?IsLatest==`false`].[Key,VersionId]' \
              --output text | while read key version_id; do
                aws s3api copy-object \
                  --bucket "$BUCKET_NAME" \
                  --copy-source "$BUCKET_NAME/$key?versionId=$version_id" \
                  --key "$key"
              done
          else
            echo "⚠️  Manual version rollback not implemented for S3. Use backup restoration instead."
          fi
          
          # Invalidate CloudFront
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "Postolio-${{ github.event.inputs.environment }}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
          
          echo "✅ Web frontend rolled back"

      - name: Rollback Lambda service
        if: |
          github.event.inputs.service != 'api' && 
          github.event.inputs.service != 'web' && 
          github.event.inputs.service != 'all'
        run: |
          FUNCTION_NAME="postolio-${{ github.event.inputs.environment }}-${{ github.event.inputs.service }}"
          
          if [[ "${{ steps.version.outputs.version }}" != "" ]]; then
            # Create alias pointing to previous version
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name "live" \
              --function-version "${{ steps.version.outputs.version }}" || \
            aws lambda create-alias \
              --function-name "$FUNCTION_NAME" \
              --name "live" \
              --function-version "${{ steps.version.outputs.version }}"
            
            echo "✅ Lambda function ${{ github.event.inputs.service }} rolled back to version: ${{ steps.version.outputs.version }}"
          else
            echo "❌ Could not determine previous version for rollback"
            exit 1
          fi

      - name: Health check after rollback
        run: |
          echo "🏥 Running health checks after rollback..."
          
          # Check API health
          if [[ "${{ github.event.inputs.service }}" == "api" || "${{ github.event.inputs.service }}" == "all" ]]; then
            API_URL=$(aws cloudformation describe-stacks \
              --stack-name "Postolio-${{ github.event.inputs.environment }}" \
              --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
              --output text)
            
            if curl -f "$API_URL/health" > /dev/null 2>&1; then
              echo "✅ API health check passed"
            else
              echo "❌ API health check failed"
              exit 1
            fi
          fi

      - name: Notify rollback completion
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const message = `
            ## ${status} Rollback ${{ job.status === 'success' ? 'Completed' : 'Failed' }}
            
            **Environment:** ${{ github.event.inputs.environment }}
            **Service:** ${{ github.event.inputs.service }}
            **Version:** ${{ steps.version.outputs.version || github.event.inputs.version }}
            **Initiated by:** ${{ github.actor }}
            **Time:** ${new Date().toISOString()}
            
            ${job.status !== 'success' ? '⚠️ Please check the logs for details.' : ''}
            `;
            
            // Create an issue for rollback tracking
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rollback: ${github.event.inputs.environment} - ${github.event.inputs.service}`,
              body: message,
              labels: ['rollback', github.event.inputs.environment]
            });