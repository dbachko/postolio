name: Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: postolio
  NODE_VERSION: '22'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate deployment prerequisites
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required GitHub secrets
        run: |
          echo "🔍 Validating GitHub repository secrets for AWS deployment..."
          echo
          
          # Track if any secrets are missing
          MISSING_SECRETS=false
          
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ AWS_ACCESS_KEY_ID secret is missing"
            MISSING_SECRETS=true
          else
            echo "✅ AWS_ACCESS_KEY_ID is configured"
          fi
          
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ AWS_SECRET_ACCESS_KEY secret is missing"
            MISSING_SECRETS=true
          else
            echo "✅ AWS_SECRET_ACCESS_KEY is configured"
          fi
          
          if [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "❌ AWS_ACCOUNT_ID secret is missing"
            MISSING_SECRETS=true
          else
            echo "✅ AWS_ACCOUNT_ID is configured"
          fi
          
          if [ "$MISSING_SECRETS" = true ]; then
            echo
            echo "🚨 DEPLOYMENT CANNOT PROCEED - Missing AWS credentials"
            echo
            echo "To fix this issue:"
            echo "1. Go to your GitHub repository"
            echo "2. Navigate to Settings > Secrets and variables > Actions"
            echo "3. Click 'New repository secret' for each missing secret:"
            echo
            echo "   AWS_ACCESS_KEY_ID:"
            echo "   - Get from AWS Console > IAM > Users > Create User"
            echo "   - Choose 'Programmatic access'"
            echo "   - Attach permissions policy (see docs/AWS_DEPLOYMENT_STRATEGY.md)"
            echo
            echo "   AWS_SECRET_ACCESS_KEY:"
            echo "   - Generated when you create the IAM user above"
            echo "   - Copy the secret access key (shown only once)"
            echo
            echo "   AWS_ACCOUNT_ID:"
            echo "   - Find in AWS Console > Account menu (top right) > Account"
            echo "   - Should be a 12-digit number"
            echo
            echo "📖 See docs/AWS_DEPLOYMENT_STRATEGY.md for detailed setup instructions"
            echo
            exit 1
          fi
          
          echo
          echo "🎉 All required AWS secrets are configured!"
          echo "✅ Deployment can proceed"

  build:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Validate AWS credentials
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ Error: AWS_ACCESS_KEY_ID secret is not set"
            echo "Please configure this secret in your GitHub repository settings:"
            echo "Go to Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ Error: AWS_SECRET_ACCESS_KEY secret is not set"
            echo "Please configure this secret in your GitHub repository settings:"
            echo "Go to Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "✅ AWS credentials secrets are configured"

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          # Create ECR repository if it doesn't exist
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region $AWS_REGION || \
          aws ecr create-repository --repository-name $ECR_REPOSITORY --region $AWS_REGION --image-scanning-configuration scanOnPush=true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'aws-infrastructure/package-lock.json'

      - name: Validate AWS deployment credentials
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ Error: AWS_ACCESS_KEY_ID secret is not set"
            echo "Required for infrastructure deployment to AWS"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ Error: AWS_SECRET_ACCESS_KEY secret is not set"
            echo "Required for infrastructure deployment to AWS"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "❌ Error: AWS_ACCOUNT_ID secret is not set"
            echo "Required for CDK deployment context"
            echo "Find your AWS Account ID: AWS Console > Account menu (top right) > Account"
            exit 1
          fi
          echo "✅ All AWS deployment credentials are configured"

      - name: Install CDK dependencies
        run: |
          cd aws-infrastructure
          npm ci

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap CDK (if needed)
        run: |
          cd aws-infrastructure
          # Bootstrap CDK in the target AWS account/region
          # This creates the necessary S3 buckets, IAM roles, etc. for CDK deployments
          # Safe to run multiple times (idempotent operation)
          npm run cdk -- bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}
        env:
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Deploy infrastructure
        run: |
          cd aws-infrastructure
          # Note: The -c environment=dev parameter is used for development deployments
          # The CDK app creates stacks with name "Postolio-${environment}" where
          # environment defaults to 'dev' if not specified via context
          # CRITICAL: useEcrImage=true ensures the deployed task uses the ECR image instead of base Node.js image
          npm run cdk -- deploy Postolio-dev --require-approval never -c environment=dev -c useEcrImage=true
        env:
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Validate AWS credentials for frontend deployment
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ Error: AWS_ACCESS_KEY_ID secret is not set"
            echo "Required for frontend S3/CloudFront deployment"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ Error: AWS_SECRET_ACCESS_KEY secret is not set"  
            echo "Required for frontend S3/CloudFront deployment"
            exit 1
          fi
          echo "✅ AWS credentials configured for frontend deployment"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          # Use unified domain architecture - frontend and backend share the same domain
          # Frontend: postolio.example/* -> CloudFront -> S3  
          # Backend API: postolio.example/api/* -> CloudFront -> ALB -> ECS
          echo "VITE_API_BASE_URL=https://postolio.example/api" > .env.production
          npm run build

      - name: Deploy frontend to S3
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name Postolio-dev --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' --output text)
          aws s3 sync frontend/dist s3://$BUCKET_NAME --delete
          
          # Invalidate CloudFront cache
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='Postolio-dev/FrontendDistribution'].Id" --output text)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-frontend]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Deployment Status
        run: |
          if [[ "${{ needs.deploy-infrastructure.result }}" == "success" && "${{ needs.deploy-frontend.result }}" == "success" ]]; then
            echo "✅ Deployment successful!"
            echo "Backend: Check the LoadBalancerDNS output from the CloudFormation stack"
            echo "Frontend: Check the FrontendDistributionDomainName output from the CloudFormation stack"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
