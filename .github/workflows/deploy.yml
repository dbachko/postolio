name: Deploy Stack-Based Architecture

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      stacks:
        description: 'Stacks to deploy (comma-separated, or "all")'
        required: false
        default: 'all'
      forceRebuild:
        description: 'Force rebuild API Docker image'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-stack-${{ github.ref }}-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write
  pull-requests: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  NODE_VERSION: '22'
  PNPM_VERSION: '10.20.0'
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  DATA_DELETION_RECOVERY_MINUTES: ${{ vars.DATA_DELETION_RECOVERY_MINUTES }}

jobs:
  # ============================================
  # STEP 1: Detect Changes and Plan Deployment
  # ============================================
  detect-changes:
    name: Detect Changes & Plan Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      foundation-changed: ${{ steps.changes.outputs.foundation }}
      auth-changed: ${{ steps.changes.outputs.auth }}
      scheduling-changed: ${{ steps.changes.outputs.scheduling }}
      brand-analysis-changed: ${{ steps.changes.outputs.brand-analysis }}
      publishing-changed: ${{ steps.changes.outputs.publishing }}
      api-changed: ${{ steps.changes.outputs.api }}
      asset-library-changed: ${{ steps.changes.outputs.asset-library }}
      analytics-changed: ${{ steps.changes.outputs.analytics }}
      web-changed: ${{ steps.changes.outputs.web }}
      infra-changed: ${{ steps.changes.outputs.infra }}
      any-stack-changed: ${{ steps.changes.outputs.any-stack }}
      stack-matrix: ${{ steps.matrix.outputs.stack-matrix }}
      image-matrix: ${{ steps.images.outputs.image-matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Determine diff base for change detection
        if: github.event_name != 'workflow_dispatch'
        id: diffbase
        shell: bash
        run: |
          # Default to previous commit on the same ref for push/manual, PR uses PR base
          EVENT="${{ github.event_name }}"
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "$EVENT" == "push" ]]; then
            BASE="${{ github.event.before }}"
          else
            # workflow_dispatch or other: compare with previous commit
            BASE="HEAD^"
          fi

          # Fallback if BASE is empty or all zeros
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="HEAD^"
          fi

          # Ensure BASE resolves; if HEAD has no parent (e.g., first commit),
          # fall back to the initial commit so paths-filter can compute a diff.
          if ! git rev-parse --verify -q "$BASE" >/dev/null; then
            ROOT_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n1)
            if [[ -n "$ROOT_COMMIT" ]]; then
              BASE="$ROOT_COMMIT"
            else
              # As a last resort, use HEAD itself to avoid failure (yields empty diff)
              BASE="HEAD"
            fi
          fi

          echo "Using diff base: $BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Setup change detection
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          # Ensure ref resolves to a concrete commit (not branch name)
          # This prevents git errors like: merge-base HEAD^...main (exit code 128)
          ref: ${{ github.sha }}
          base: ${{ steps.diffbase.outputs.base }}
          filters: |
            foundation:
              - 'packages/infra/cdk/lib/stacks/ecr-registry-stack.ts'
              - 'packages/infra/cdk/lib/stacks/foundation-*.ts'
            auth:
              - 'packages/services/token-service/**'
              - 'packages/infra/cdk/lib/stacks/auth-stack.ts'
              - 'packages/libs/**'
            scheduling:
              - 'packages/services/schedule-management/**'
              - 'packages/services/schedule-cleanup/**'
              - 'packages/services/status-sync/**'
              - 'packages/infra/cdk/lib/stacks/scheduling-stack.ts'
              - 'packages/libs/**'
            brand-analysis:
              - 'packages/services/brand-analysis/**'
              - 'packages/services/brand-analysis-projection/**'
              - 'packages/services/brand-analysis-scheduler/**'
              - 'packages/infra/cdk/lib/stacks/brand-analysis-stack.ts'
              - 'packages/libs/**'
            publishing:
              - 'packages/services/publisher/**'
              - 'packages/services/retry-handler/**'
              - 'packages/services/dlq-processor/**'
              - 'packages/services/campaign-event-dlq-processor/**'
              - 'packages/infra/cdk/lib/stacks/publishing-stack.ts'
              - 'packages/libs/**'
            api:
              - 'packages/apps/api/**'
              - 'packages/infra/cdk/lib/stacks/api-stack.ts'
              - 'packages/libs/**'
            asset-library:
              - 'packages/apps/assets/**'
              - 'packages/apps/assets-api/**'
              - 'packages/services/asset-thumbnail-generator/**'
              - 'packages/services/asset-ai-analyzer/**'
              - 'packages/libs/database-assets/**'
              - 'packages/infra/cdk/lib/stacks/asset-library-stack.ts'
              - 'packages/libs/**'
            analytics:
              - 'packages/services/analytics-ingestor/**'
              - 'packages/infra/cdk/lib/stacks/analytics-stack.ts'
              - 'packages/libs/**'
            web:
              - 'packages/apps/web/**'
              - 'packages/infra/cdk/lib/stacks/web-stack.ts'
              - 'packages/libs/**'
            infra:
              - 'packages/infra/**'
              - '.github/workflows/**'
            any-stack:
              - 'packages/services/**'
              - 'packages/apps/**'
              - 'packages/libs/**'
              - 'packages/infra/**'

      - name: Generate stack deployment matrix
        id: matrix
        run: |
          STACKS=()
          ALL_STACKS=("foundation" "auth" "scheduling" "brand-analysis" "publishing" "api" "asset-library" "analytics" "web")

          # Manual runs from the UI: deploy all stacks by default (or a specific list if provided)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ github.event.inputs.stacks }}" && "${{ github.event.inputs.stacks }}" != "all" ]]; then
              IFS=',' read -ra REQUESTED_STACKS <<< "${{ github.event.inputs.stacks }}"
              for stack in "${REQUESTED_STACKS[@]}"; do
                # Append as plain values; we'll quote when building JSON
                STACKS+=("$stack")
              done
            else
              for s in "${ALL_STACKS[@]}"; do STACKS+=("$s"); done
            fi
          else
            # Auto-detect changed stacks
            [[ "${{ steps.changes.outputs.foundation }}" == "true" ]] && STACKS+=("foundation")
            [[ "${{ steps.changes.outputs.auth }}" == "true" ]] && STACKS+=("auth")
            [[ "${{ steps.changes.outputs.scheduling }}" == "true" ]] && STACKS+=("scheduling")
            [[ "${{ steps.changes.outputs.publishing }}" == "true" ]] && STACKS+=("publishing")
            [[ "${{ steps.changes.outputs.brand-analysis }}" == "true" ]] && STACKS+=("brand-analysis")
            [[ "${{ steps.changes.outputs.api }}" == "true" ]] && STACKS+=("api")
            [[ "${{ steps.changes.outputs.asset-library }}" == "true" ]] && STACKS+=("asset-library")
            [[ "${{ steps.changes.outputs.analytics }}" == "true" ]] && STACKS+=("analytics")
            [[ "${{ steps.changes.outputs.web }}" == "true" ]] && STACKS+=("web")

            # If infra changed, deploy all stacks
            if [[ "${{ steps.changes.outputs.infra }}" == "true" ]]; then
              STACKS=()
              for s in "${ALL_STACKS[@]}"; do STACKS+=("$s"); done
            fi

            # If pushing to main/master and nothing changed, still deploy all stacks
            if [[ ${#STACKS[@]} -eq 0 && "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ) ]]; then
              for s in "${ALL_STACKS[@]}"; do STACKS+=("$s"); done
            fi
          fi

          # Expand to include transitive dependents so that changes in a base stack
          # also redeploy stacks that depend on it (scheduler -> publishing, api, etc.)
          if [ ${#STACKS[@]} -gt 0 ]; then
            # Convert to simple comma string for membership checks
            STACKS_STR=$(IFS=,; echo "${STACKS[*]}")
            add_unique() {
              local name="$1"
              if [[ ",$STACKS_STR," != *",\"$name\","* ]]; then
                STACKS+=("\"$name\"")
                STACKS_STR=$(IFS=,; echo "${STACKS[*]}")
              fi
            }

            # If foundation changed -> everything depends on it
            if [[ "$STACKS_STR" == *"\"foundation\""* ]]; then
              for s in "${ALL_STACKS[@]}"; do
                add_unique "$s"
              done
            fi

            # If auth changed -> scheduling, publishing, api depend on it
            if [[ "$STACKS_STR" == *"\"auth\""* ]]; then
              add_unique "scheduling"
              add_unique "publishing"
              add_unique "api"
              add_unique "analytics"
            fi

            # If scheduling changed -> publishing and api depend on it
            if [[ "$STACKS_STR" == *"\"scheduling\""* ]]; then
              add_unique "publishing"
              add_unique "api"
            fi

            # If publishing changed -> api depends on it
            if [[ "$STACKS_STR" == *"\"publishing\""* ]]; then
              add_unique "api"
            fi
          fi

          if [ ${#STACKS[@]} -eq 0 ]; then
            echo "stack-matrix=[]" >> $GITHUB_OUTPUT
            echo "Stacks to deploy: []"
          else
            # Build valid JSON array (e.g., ["foundation","auth"]) without double-escaping
            JSON_ARRAY=$(printf '"%s",' "${STACKS[@]}")
            JSON_ARRAY="[${JSON_ARRAY%,}]"
          echo "stack-matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Stacks to deploy: $JSON_ARRAY"
          fi

      - name: Generate images build matrix
        id: images
        shell: bash
        run: |
          # Default: no images selected
          MATRIX="[]"

          EVENT="${{ github.event_name }}"
          FORCE_REBUILD="${{ github.event.inputs.forceRebuild || 'false' }}"

          add_image() {
            local name="$1"; local dockerfile="$2"; local scope="$3"
            if [[ "$MATRIX" == "[]" ]]; then
              MATRIX='[{"name":"'"$name"'","dockerfile":"'"$dockerfile"'","scope":"'"$scope"'"}]'
            else
              # Use compact JSON to avoid newlines in GitHub output file commands
              MATRIX=$(echo "$MATRIX" | jq -c --arg n "$name" --arg f "$dockerfile" --arg s "$scope" '. + [{name:$n,dockerfile:$f,scope:$s}]')
            fi
          }

          # If manual run or forceRebuild, build all images (preserves current behavior)
          if [[ "$EVENT" == "workflow_dispatch" || "$FORCE_REBUILD" == "true" ]]; then
            add_image api packages/apps/api/Dockerfile api
            add_image assets packages/apps/assets-api/Dockerfile assets
            add_image analytics packages/services/analytics-ingestor/Dockerfile analytics
          else
            # Use change detection flags
            if [[ "${{ steps.changes.outputs.api }}" == "true" ]]; then
              add_image api packages/apps/api/Dockerfile api
            fi
            if [[ "${{ steps.changes.outputs.asset-library }}" == "true" ]]; then
              add_image assets packages/apps/assets-api/Dockerfile assets
            fi
            if [[ "${{ steps.changes.outputs.analytics }}" == "true" ]]; then
              add_image analytics packages/services/analytics-ingestor/Dockerfile analytics
            fi

            # On push to main/master, build all images (release behavior)
            if [[ "$EVENT" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ) ]]; then
              MATRIX='[{"name":"api","dockerfile":"packages/apps/api/Dockerfile","scope":"api"},{"name":"assets","dockerfile":"packages/apps/assets-api/Dockerfile","scope":"assets"},{"name":"analytics","dockerfile":"packages/services/analytics-ingestor/Dockerfile","scope":"analytics"}]'
            fi
          fi

          # Ensure matrix is compact JSON (single line) before exporting as output
          MATRIX=$(echo "$MATRIX" | jq -c '.')
          echo "image-matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Images to build: $MATRIX"

      - name: Debug change detection outputs
        if: always()
        run: |
          echo "environment=${{ steps.env.outputs.environment }}"
          echo "foundation=${{ steps.changes.outputs.foundation }}"
          echo "auth=${{ steps.changes.outputs.auth }}"
          echo "scheduling=${{ steps.changes.outputs.scheduling }}"
          echo "brand-analysis=${{ steps.changes.outputs.brand-analysis }}"
          echo "publishing=${{ steps.changes.outputs.publishing }}"
          echo "api=${{ steps.changes.outputs.api }}"
          echo "asset-library=${{ steps.changes.outputs.asset-library }}"
          echo "analytics=${{ steps.changes.outputs.analytics }}"
          echo "web=${{ steps.changes.outputs.web }}"
          echo "infra=${{ steps.changes.outputs.infra }}"
          echo "any-stack=${{ steps.changes.outputs.any-stack }}"
          echo "stack-matrix=${{ steps.matrix.outputs.stack-matrix }}"
          echo "image-matrix=${{ steps.images.outputs.image-matrix }}"

  # (PR tests are handled in .github/workflows/pr-checks.yml. Removed duplicate test job from deploy.)

  # ============================================
  # STEP 3: Build Docker Image (API on change)
  # ============================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Add timeout for image builds
    needs: detect-changes
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.image-matrix != '[]'
    environment: ${{ needs.detect-changes.outputs.environment }}
    strategy:
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.image-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image.name }} Docker image
        uses: docker/build-push-action@v5
        env:
          REPO_NAME: postolio
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.REPO_NAME }}:${{ matrix.image.name }}-${{ needs.detect-changes.outputs.environment }}-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.REPO_NAME }}:${{ matrix.image.name }}-${{ needs.detect-changes.outputs.environment }}-latest
          cache-from: type=gha,scope=${{ matrix.image.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.scope }}
          build-args: |
            NODE_ENV=${{ needs.detect-changes.outputs.environment }}

  # ============================================
  # STEP 4: Deploy Stacks
  # ============================================
  deploy-stacks:
    name: Deploy ${{ matrix.stack }} Stack
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    timeout-minutes: 60 # Increase timeout for CDK deployments
    if: |
      github.event_name != 'pull_request' &&
      needs.detect-changes.outputs.stack-matrix != '[]' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    environment: ${{ needs.detect-changes.outputs.environment }}
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.stack-matrix) }}
      max-parallel: 1 # Deploy stacks sequentially to avoid resource contention
      fail-fast: false # Allow other stacks to continue if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CDK Setup
        uses: ./.github/actions/cdk-setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: CDK Bootstrap (if needed)
        timeout-minutes: 15 # Extended timeout for bootstrap
        working-directory: packages/infra/cdk
        run: |
          echo "Checking CDK bootstrap status..."
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit &>/dev/null; then
            echo "CDK not bootstrapped, running bootstrap..."
            pnpm cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} --verbose
            echo "CDK bootstrap completed"
          else
            echo "CDK already bootstrapped"
          fi

      - name: Wait for dependencies
        timeout-minutes: 45 # Extended timeout for dependency waiting
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"
          STACK="${{ matrix.stack }}"

          # Define stack dependencies
          case $STACK in
            "foundation")
              DEPS=()
              ;;
            "auth")
              DEPS=("Postolio-Foundation-$ENV")
              ;;
            "scheduling")
              DEPS=("Postolio-Auth-$ENV")
              ;;
            "brand-analysis")
              DEPS=("Postolio-Foundation-$ENV" "Postolio-Scheduling-$ENV")
              ;;
            "publishing")
              DEPS=("Postolio-Auth-$ENV" "Postolio-Scheduling-$ENV")
              ;;
            "api")
              DEPS=("Postolio-Foundation-$ENV" "Postolio-Auth-$ENV" "Postolio-Scheduling-$ENV" "Postolio-Publishing-$ENV")
              ;;
            "asset-library")
              DEPS=("Postolio-Foundation-$ENV")
              ;;
            "analytics")
              DEPS=("Postolio-Foundation-$ENV" "Postolio-Auth-$ENV")
              ;;
            "web")
              DEPS=("Postolio-API-$ENV")
              ;;
          esac

          # Wait for dependencies to be ready
          for dep_stack in "${DEPS[@]}"; do
            echo "Waiting for dependency: $dep_stack"
            WAIT_TIME=0
            MAX_WAIT=2400  # 40 minutes (increased from 30)

            while [ $WAIT_TIME -lt $MAX_WAIT ]; do
              STATUS=$(aws cloudformation describe-stacks --stack-name "$dep_stack" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")

              if [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]; then
                echo "Dependency $dep_stack is ready: $STATUS"
                break
              elif [[ "$STATUS" == "DOES_NOT_EXIST" ]]; then
                echo "Dependency $dep_stack does not exist yet, waiting..."
                sleep 30
                WAIT_TIME=$((WAIT_TIME + 30))
              elif [[ "$STATUS" == *"IN_PROGRESS" ]]; then
                echo "Dependency $dep_stack deployment in progress: $STATUS"
                sleep 60
                WAIT_TIME=$((WAIT_TIME + 60))
              elif [[ "$STATUS" == *"FAILED" || "$STATUS" == "ROLLBACK_COMPLETE" ]]; then
                echo "Dependency $dep_stack failed: $STATUS"
                # Check if this is a transient failure and allow retry
                echo "Checking stack events for details..."
                aws cloudformation describe-stack-events --stack-name "$dep_stack" --max-items 5 --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[LogicalResourceId,ResourceStatusReason]' --output table || true
                exit 1
              else
                echo "Dependency $dep_stack status: $STATUS"
                break
              fi
            done

            if [ $WAIT_TIME -ge $MAX_WAIT ]; then
              echo "Timeout waiting for dependency $dep_stack"
              exit 1
            fi
          done

      - name: Build stack dependencies
        run: |
          STACK="${{ matrix.stack }}"

          # Ensure shared logger package is compiled for stacks that import it
          if [[ "$STACK" == "api" || "$STACK" == "asset-library" ]]; then
            pnpm --filter=@postolio/logger build
          fi

          # Build shared libraries and services based on stack
          case "$STACK" in
            "auth"|"scheduling"|"publishing")
              # Build shared libraries for microservices
              pnpm --filter=@postolio/database build || true
              pnpm --filter=@postolio/errors build || true
              pnpm --filter=@postolio/aws build
              ;;
            "api")
              # Build API and its dependencies
              pnpm --filter=@postolio/database build || true
              pnpm --filter=@postolio/errors build || true
              # Ensure social connectors lib is compiled before API build
              pnpm --filter=@postolio/connectors build || true
              pnpm --filter=@postolio/csrf-client build || true
              pnpm --filter=api build
              ;;
            "asset-library")
              # Build assets API and its dependencies
              pnpm --filter=@postolio/database-assets build || true
              pnpm --filter=@postolio/errors build || true
              pnpm --filter=@postolio/assets-api run build:server || true
              ;;
            "web")
              # Build frontend dependencies
              pnpm --filter=@postolio/csrf-client build || true
              pnpm --filter=@postolio/errors build || true
              pnpm --filter=@postolio/database build || true
              ;;
          esac

      - name: Deploy Stack via CDK
        timeout-minutes: 45 # Extended timeout for CDK deployments
        working-directory: packages/infra/cdk
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          INSTAGRAM_APP_ID: ${{ vars.INSTAGRAM_APP_ID }}
          INSTAGRAM_REDIRECT_URI: ${{ vars.INSTAGRAM_REDIRECT_URI }}
          LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          ENABLE_MONITORING: ${{ vars.ENABLE_MONITORING }}
          # Signup gating variables (optional)
          AUTH_SIGNUPS_MODE: ${{ vars.AUTH_SIGNUPS_MODE }}
          AUTH_ALLOWLIST_EMAILS: ${{ vars.AUTH_ALLOWLIST_EMAILS }}
          WAITLIST_URL: ${{ vars.WAITLIST_URL }}
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"
          STACK="${{ matrix.stack }}"

          # Determine image tag strategy based on whether build-images ran
          # - If build ran (success): use per-commit tag
          # - If build skipped: reuse environment latest tag

          # For API stack
          if [[ "${{ needs.build-images.result }}" == "success" && ("${{ needs.detect-changes.outputs.api-changed }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push") ]]; then
            API_IMAGE_TAG="api-$ENV-${{ github.sha }}"
          else
            API_IMAGE_TAG="api-$ENV-latest"
          fi

          # For Asset Library stack
          if [[ "${{ needs.build-images.result }}" == "success" && ("${{ needs.detect-changes.outputs.asset-library-changed }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push") ]]; then
            ASSETS_IMAGE_TAG="assets-$ENV-${{ github.sha }}"
          else
            ASSETS_IMAGE_TAG="assets-$ENV-latest"
          fi

          # For Analytics stack
          if [[ "${{ needs.build-images.result }}" == "success" && ("${{ needs.detect-changes.outputs.analytics-changed }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push") ]]; then
            ANALYTICS_IMAGE_TAG="analytics-$ENV-${{ github.sha }}"
          else
            ANALYTICS_IMAGE_TAG="analytics-$ENV-latest"
          fi

          # Select appropriate image tag based on stack being deployed
          case $STACK in
            "api")
              IMAGE_TAG="$API_IMAGE_TAG"
              ;;
            "asset-library")
              IMAGE_TAG="$ASSETS_IMAGE_TAG"
              ;;
            "analytics")
              IMAGE_TAG="$ANALYTICS_IMAGE_TAG"
              ;;
            *)
              # Other stacks don't use image tags, but set a default for consistency
              IMAGE_TAG="$API_IMAGE_TAG"
              ;;
          esac

          # Map stack names to CDK stack names
          case $STACK in
            "foundation")
              CDK_STACK="Postolio-Foundation-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "auth")
              CDK_STACK="Postolio-Auth-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "scheduling")
              CDK_STACK="Postolio-Scheduling-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "brand-analysis")
              CDK_STACK="Postolio-BrandAnalysis-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "publishing")
              CDK_STACK="Postolio-Publishing-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "api")
              CDK_STACK="Postolio-API-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "asset-library")
              CDK_STACK="Postolio-AssetLibrary-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "analytics")
              CDK_STACK="Postolio-Analytics-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "web")
              CDK_STACK="Postolio-Web-$ENV"
              CDK_APP="bin/app.ts"
              ;;
          esac

          # Deploy the stack with enhanced retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=60  # Start with 60 seconds
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES for $CDK_STACK"

            # Check if stack exists and log its status (no automatic deletion)
            STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$CDK_STACK" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")

            if [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]]; then
              echo "⚠️ Stack is in ROLLBACK_COMPLETE state. Manual intervention may be required."
              echo "To fix this, you can manually delete the stack using:"
              echo "  aws cloudformation delete-stack --stack-name $CDK_STACK"
              # Continue with deployment attempt - CDK may handle this
            fi

            if timeout 2400 pnpm cdk deploy "$CDK_STACK" \
              --app "npx tsx $CDK_APP" \
              --require-approval never \
              --context environment="$ENV" \
              --context onlyStack="$STACK" \
              --context imageTag="$IMAGE_TAG" \
              --context domainName="${{ vars.DOMAIN_NAME }}" \
              --context corsOrigin="${{ vars.VITE_API_URL }}" \
              --context authMagicLinkEnabled="${{ vars.AUTH_MAGIC_LINK_ENABLED }}" \
              --context openaiApiKey="$OPENAI_API_KEY" \
              --context googleClientId="$GOOGLE_CLIENT_ID" \
              --context googleClientSecret="$GOOGLE_CLIENT_SECRET" \
              --context facebookAppId="$FACEBOOK_APP_ID" \
              --context facebookAppSecret="$FACEBOOK_APP_SECRET" \
              --context instagramAppId="$INSTAGRAM_APP_ID" \
              --context instagramAppSecret="$INSTAGRAM_APP_SECRET" \
              --context instagramRedirectUri="$INSTAGRAM_REDIRECT_URI" \
              --context linkedinClientId="$LINKEDIN_CLIENT_ID" \
              --context linkedinClientSecret="$LINKEDIN_CLIENT_SECRET" \
              --context tiktokClientKey="$TIKTOK_CLIENT_KEY" \
              --context tiktokClientSecret="$TIKTOK_CLIENT_SECRET" \
              --context nodeEnv="$NODE_ENV" \
              --context logLevel="$LOG_LEVEL" \
              --context enableMonitoring="$ENABLE_MONITORING" \
              --verbose; then
              echo "CDK deployment successful for $CDK_STACK"
              SUCCESS=true
              break
            else
              EXIT_CODE=$?
              RETRY_COUNT=$((RETRY_COUNT + 1))
              
              echo "CDK deployment failed for $CDK_STACK with exit code $EXIT_CODE"
              
              # Get detailed error information
              echo "Getting stack events for debugging..."
              aws cloudformation describe-stack-events --stack-name "$CDK_STACK" --max-items 10 --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[LogicalResourceId,ResourceStatusReason]' --output table || true

              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Retrying in $RETRY_DELAY seconds... (Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES)"
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))  # Exponential backoff
              fi
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "CDK deployment failed for $CDK_STACK after $MAX_RETRIES attempts"
            exit 1
          fi

  # ============================================
  # STEP 5: Deploy Frontend to S3 (Web Stack)
  # ============================================
  deploy-frontend:
    name: Deploy Frontend Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Add timeout for frontend deployment
    needs: [detect-changes, deploy-stacks]
    if: |
      github.event_name != 'pull_request' &&
      (needs.deploy-stacks.result == 'success' || needs.deploy-stacks.result == 'skipped') &&
      (
        contains(needs.detect-changes.outputs.stack-matrix, 'web') ||
        github.event_name == 'workflow_dispatch'
      )
    environment: ${{ needs.detect-changes.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend dependencies
        run: |
          pnpm --filter=@postolio/csrf-client build || true
          pnpm --filter=@postolio/errors build || true
          pnpm --filter=@postolio/database build || true

      - name: Build frontend
        working-directory: packages/apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_FACEBOOK_APP_ID: ${{ vars.VITE_FACEBOOK_APP_ID }}
          VITE_AUTH_GOOGLE_ENABLED: ${{ vars.VITE_AUTH_GOOGLE_ENABLED }}
          VITE_AUTH_FACEBOOK_ENABLED: ${{ vars.VITE_AUTH_FACEBOOK_ENABLED }}
          VITE_AUTH_MAGIC_LINK_ENABLED: ${{ vars.VITE_AUTH_MAGIC_LINK_ENABLED }}
          VITE_FEATURE_AI_SUGGESTIONS: ${{ vars.VITE_FEATURE_AI_SUGGESTIONS }}
          VITE_FEATURE_VIDEO_SUPPORT: ${{ vars.VITE_FEATURE_VIDEO_SUPPORT }}
          VITE_ENVIRONMENT: ${{ needs.detect-changes.outputs.environment }}
        run: pnpm build

      - name: Deploy to S3
        working-directory: packages/apps/web
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "Postolio-Web-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)

          if [[ -z "$BUCKET_NAME" ]]; then
            echo "Error: Frontend bucket not found"
            exit 1
          fi

          # Sync static assets with cache
          aws s3 sync dist/ s3://$BUCKET_NAME/ \
            --delete \
            --exclude "index.html" \
            --exclude "*.js.map" \
            --cache-control "public, max-age=31536000, immutable"

          # Upload index.html without cache
          aws s3 cp dist/index.html s3://$BUCKET_NAME/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "Postolio-Web-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          if [[ -n "$DISTRIBUTION_ID" ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          fi

  # ============================================
  # STEP 6: Deployment Summary
  # ============================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Short timeout for summary
    needs: [detect-changes, deploy-stacks, deploy-frontend]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Generate deployment report
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Stack-Based Deployment Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📍 Environment: ${{ needs.detect-changes.outputs.environment }}"
          echo "🔄 Commit: ${{ github.sha }}"
          echo ""
          echo "📊 Job Results:"
          echo "  - Stack Deployment: ${{ needs.deploy-stacks.result }}"
          echo "  - Frontend Deployment: ${{ needs.deploy-frontend.result }}"
          echo ""
          echo "📦 Deployed Stacks:"
          STACKS='${{ needs.detect-changes.outputs.stack-matrix }}'
          if [[ -z "$STACKS" || "$STACKS" == "null" ]]; then
            STACKS='[]'
          fi
          if [[ "$STACKS" != "[]" ]]; then
            if ! echo "$STACKS" | jq -r '.[] | "  ✅ " + . + " Stack"'; then
              echo "  ⚠️  Unable to parse stack list: $STACKS"
            fi
          else
            echo "  ℹ️  No stacks deployed (no changes detected)"
          fi
          echo ""
          echo "🔗 Application URL: ${{ vars.VITE_API_URL }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Check deployment failures
        if: |
          needs.deploy-stacks.result == 'failure' || 
          needs.deploy-frontend.result == 'failure'
        run: |
          echo "⚠️ Some deployments failed. Check the logs for details."
          echo "Stack deployment result: ${{ needs.deploy-stacks.result }}"
          echo "Frontend deployment result: ${{ needs.deploy-frontend.result }}"
          exit 1

      - name: Send deployment notification
        if: needs.detect-changes.outputs.environment == 'prod' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const stacks = JSON.parse('${{ needs.detect-changes.outputs.stack-matrix }}');
            const stackList = stacks.map(stack => `- ${stack} Stack`).join('\n');

            const summary = `
            ## 🚀 Production Deployment Complete (Stack-Based)

            **Environment:** ${{ needs.detect-changes.outputs.environment }}
            **Commit:** ${{ github.sha }}
            **Deployed by:** ${{ github.actor }}

            ### Deployed Stacks:
            ${stackList || '- No stacks deployed'}

            ### Architecture Improvement:
            ✅ Deployed using optimized stack-based architecture
            ✅ Reduced deployment complexity from 8+ microservices to ${stacks.length} logical stacks
            ✅ Improved deployment reliability and consistency
            `;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.sha }}',
              body: summary
            });
