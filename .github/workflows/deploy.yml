name: Deploy Stack-Based Architecture

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      stacks:
        description: 'Stacks to deploy (comma-separated, or "all")'
        required: false
        default: 'all'

concurrency:
  group: deploy-stack-${{ github.ref }}-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write
  pull-requests: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  NODE_VERSION: '22'
  PNPM_VERSION: '9.9.0'
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # ============================================
  # STEP 1: Detect Changes and Plan Deployment
  # ============================================
  detect-changes:
    name: Detect Changes & Plan Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      foundation-changed: ${{ steps.changes.outputs.foundation }}
      auth-changed: ${{ steps.changes.outputs.auth }}
      scheduling-changed: ${{ steps.changes.outputs.scheduling }}
      publishing-changed: ${{ steps.changes.outputs.publishing }}
      api-changed: ${{ steps.changes.outputs.api }}
      web-changed: ${{ steps.changes.outputs.web }}
      infra-changed: ${{ steps.changes.outputs.infra }}
      any-stack-changed: ${{ steps.changes.outputs.any-stack }}
      stack-matrix: ${{ steps.matrix.outputs.stack-matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup change detection
        uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            foundation:
              - 'packages/infra/cdk/lib/stacks/ecr-registry-stack.ts'
              - 'packages/infra/cdk/lib/stacks/foundation-*.ts'
            auth:
              - 'packages/services/token-service/**'
              - 'packages/infra/cdk/lib/stacks/auth-stack.ts'
              - 'packages/libs/**'
            scheduling:
              - 'packages/services/schedule-management/**'
              - 'packages/services/schedule-cleanup/**'
              - 'packages/services/status-sync/**'
              - 'packages/infra/cdk/lib/stacks/scheduling-stack.ts'
              - 'packages/libs/**'
            publishing:
              - 'packages/services/publisher/**'
              - 'packages/services/retry-handler/**'
              - 'packages/services/dlq-processor/**'
              - 'packages/services/campaign-event-dlq-processor/**'
              - 'packages/infra/cdk/lib/stacks/publishing-stack.ts'
              - 'packages/libs/**'
            api:
              - 'packages/apps/api/**'
              - 'packages/infra/cdk/lib/stacks/api-stack.ts'
              - 'packages/libs/**'
            web:
              - 'packages/apps/web/**'
              - 'packages/infra/cdk/lib/stacks/web-stack.ts'
            infra:
              - 'packages/infra/**'
              - '.github/workflows/**'
            any-stack:
              - 'packages/services/**'
              - 'packages/apps/**'
              - 'packages/libs/**'
              - 'packages/infra/**'

      - name: Generate stack deployment matrix
        id: matrix
        run: |
          STACKS=()
          ALL_STACKS=("foundation" "auth" "scheduling" "publishing" "api" "web")

          # Check if manual deployment with specific stacks
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.stacks }}" != "all" ]]; then
            IFS=',' read -ra REQUESTED_STACKS <<< "${{ github.event.inputs.stacks }}"
            for stack in "${REQUESTED_STACKS[@]}"; do
              STACKS+=("\"$stack\"")
            done
          else
            # Auto-detect changed stacks
            [[ "${{ steps.changes.outputs.foundation }}" == "true" ]] && STACKS+=("\"foundation\"")
            [[ "${{ steps.changes.outputs.auth }}" == "true" ]] && STACKS+=("\"auth\"")
            [[ "${{ steps.changes.outputs.scheduling }}" == "true" ]] && STACKS+=("\"scheduling\"")
            [[ "${{ steps.changes.outputs.publishing }}" == "true" ]] && STACKS+=("\"publishing\"")
            [[ "${{ steps.changes.outputs.api }}" == "true" ]] && STACKS+=("\"api\"")
            [[ "${{ steps.changes.outputs.web }}" == "true" ]] && STACKS+=("\"web\"")

            # If infra changed or pushing to main, deploy all stacks
            if [[ "${{ steps.changes.outputs.infra }}" == "true" || "${{ github.ref }}" == "refs/heads/main" ]]; then
              STACKS=()
              for s in "${ALL_STACKS[@]}"; do STACKS+=("\"$s\""); done
            fi
          fi

          if [ ${#STACKS[@]} -eq 0 ]; then
            echo "stack-matrix=[]" >> $GITHUB_OUTPUT
          else
            MATRIX=$(IFS=,; echo "[${STACKS[*]}]")
            echo "stack-matrix=$MATRIX" >> $GITHUB_OUTPUT
          fi

          echo "Stacks to deploy: $MATRIX"

  # ============================================
  # STEP 2: Run Tests (if PR)
  # ============================================
  test:
    name: Test Changed Packages
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git references
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: npx turbo lint --filter='...[origin/${{ github.base_ref || github.event.before }}]'

      - name: Run type checking
        run: |
          npx turbo typecheck --filter='...[origin/${{ github.base_ref || github.event.before }}]' || \
          npx turbo build --filter='...[origin/${{ github.base_ref || github.event.before }}]'

      - name: Run tests
        run: npx turbo test --filter='...[origin/${{ github.base_ref || github.event.before }}]'

  # ============================================
  # STEP 3: Build Docker Images (API only)
  # ============================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name != 'pull_request' &&
      (needs.detect-changes.outputs.api-changed == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    environment: ${{ needs.detect-changes.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        env:
          REPO_NAME: postolio
        with:
          context: .
          file: packages/apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.REPO_NAME }}:api-${{ needs.detect-changes.outputs.environment }}-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.REPO_NAME }}:api-${{ needs.detect-changes.outputs.environment }}-latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          build-args: |
            NODE_ENV=${{ needs.detect-changes.outputs.environment }}

  # ============================================
  # STEP 4: Deploy Stacks
  # ============================================
  deploy-stacks:
    name: Deploy ${{ matrix.stack }} Stack
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: |
      github.event_name != 'pull_request' &&
      needs.detect-changes.outputs.stack-matrix != '[]'
    environment: ${{ needs.detect-changes.outputs.environment }}
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.stack-matrix) }}
      max-parallel: 2  # Deploy stacks in controlled parallel (respecting dependencies)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CDK Setup
        uses: ./.github/actions/cdk-setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: CDK Bootstrap (if needed)
        working-directory: packages/infra/cdk
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit &>/dev/null; then
            pnpm cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}
          fi

      - name: Wait for dependencies
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"
          STACK="${{ matrix.stack }}"

          # Define stack dependencies
          case $STACK in
            "foundation")
              DEPS=()
              ;;
            "auth")
              DEPS=("Foundation-$ENV")
              ;;
            "scheduling")
              DEPS=("Auth-$ENV")
              ;;
            "publishing")
              DEPS=("Auth-$ENV" "Scheduling-$ENV")
              ;;
            "api")
              DEPS=("Foundation-$ENV" "Auth-$ENV" "Scheduling-$ENV" "Publishing-$ENV")
              ;;
            "web")
              DEPS=("API-$ENV")
              ;;
          esac

          # Wait for dependencies to be ready
          for dep_stack in "${DEPS[@]}"; do
            echo "Waiting for dependency: $dep_stack"
            WAIT_TIME=0
            MAX_WAIT=1800  # 30 minutes

            while [ $WAIT_TIME -lt $MAX_WAIT ]; do
              STATUS=$(aws cloudformation describe-stacks --stack-name "$dep_stack" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")

              if [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]; then
                echo "Dependency $dep_stack is ready: $STATUS"
                break
              elif [[ "$STATUS" == "DOES_NOT_EXIST" ]]; then
                echo "Dependency $dep_stack does not exist yet, waiting..."
                sleep 30
                WAIT_TIME=$((WAIT_TIME + 30))
              elif [[ "$STATUS" == *"IN_PROGRESS" ]]; then
                echo "Dependency $dep_stack deployment in progress: $STATUS"
                sleep 60
                WAIT_TIME=$((WAIT_TIME + 60))
              elif [[ "$STATUS" == *"FAILED" || "$STATUS" == "ROLLBACK_COMPLETE" ]]; then
                echo "Dependency $dep_stack failed: $STATUS"
                exit 1
              else
                echo "Dependency $dep_stack status: $STATUS"
                break
              fi
            done

            if [ $WAIT_TIME -ge $MAX_WAIT ]; then
              echo "Timeout waiting for dependency $dep_stack"
              exit 1
            fi
          done

      - name: Build stack dependencies
        run: |
          # Build shared libraries and services based on stack
          case "${{ matrix.stack }}" in
            "auth"|"scheduling"|"publishing")
              # Build shared libraries for microservices
              pnpm --filter=@postolio/database build || true
              pnpm --filter=@postolio/errors build || true
              pnpm --filter=@postolio/aws build
              ;;
            "api")
              # Build API and its dependencies
              pnpm --filter=@postolio/database build || true
              pnpm --filter=@postolio/errors build || true
              pnpm --filter=@postolio/csrf-client build || true
              pnpm --filter=api build
              ;;
            "web")
              # Build frontend dependencies
              pnpm --filter=@postolio/csrf-client build || true
              pnpm --filter=@postolio/errors build || true
              pnpm --filter=@postolio/database build || true
              ;;
          esac

      - name: Deploy Stack via CDK
        working-directory: packages/infra/cdk
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          INSTAGRAM_APP_ID: ${{ vars.INSTAGRAM_APP_ID }}
          LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          ENABLE_MONITORING: ${{ vars.ENABLE_MONITORING }}
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"
          STACK="${{ matrix.stack }}"

          # Map stack names to CDK stack names
          case $STACK in
            "foundation")
              CDK_STACK="Foundation-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "auth")
              CDK_STACK="Auth-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "scheduling")
              CDK_STACK="Scheduling-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "publishing")
              CDK_STACK="Publishing-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "api")
              CDK_STACK="API-$ENV"
              CDK_APP="bin/app.ts"
              ;;
            "web")
              CDK_STACK="Web-$ENV"
              CDK_APP="bin/app.ts"
              ;;
          esac

          # Deploy the stack with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=30

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES for $CDK_STACK"

            if pnpm cdk deploy "$CDK_STACK" \
              --app "npx tsx $CDK_APP" \
              --require-approval never \
              --context environment="$ENV" \
              --context imageTag="api-$ENV-${{ github.sha }}" \
              --context domainName="${{ vars.DOMAIN_NAME }}" \
              --context corsOrigin="${{ vars.VITE_API_URL }}" \
              --context openaiApiKey="$OPENAI_API_KEY" \
              --context googleClientId="$GOOGLE_CLIENT_ID" \
              --context googleClientSecret="$GOOGLE_CLIENT_SECRET" \
              --context facebookAppId="$FACEBOOK_APP_ID" \
              --context facebookAppSecret="$FACEBOOK_APP_SECRET" \
              --context instagramAppId="$INSTAGRAM_APP_ID" \
              --context instagramAppSecret="$INSTAGRAM_APP_SECRET" \
              --context linkedinClientId="$LINKEDIN_CLIENT_ID" \
              --context linkedinClientSecret="$LINKEDIN_CLIENT_SECRET" \
              --context tiktokClientKey="$TIKTOK_CLIENT_KEY" \
              --context tiktokClientSecret="$TIKTOK_CLIENT_SECRET" \
              --context nodeEnv="$NODE_ENV" \
              --context logLevel="$LOG_LEVEL" \
              --context enableMonitoring="$ENABLE_MONITORING"; then
              echo "CDK deployment successful for $CDK_STACK"
              break
            else
              EXIT_CODE=$?
              RETRY_COUNT=$((RETRY_COUNT + 1))

              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "CDK deployment failed for $CDK_STACK with exit code $EXIT_CODE. Retrying in $RETRY_DELAY seconds..."
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))
              else
                echo "CDK deployment failed for $CDK_STACK after $MAX_RETRIES attempts"
                exit $EXIT_CODE
              fi
            fi
          done

      - name: Update ECS Service (API Stack only)
        if: matrix.stack == 'api'
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"

          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name "API-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" \
            --output text)

          SERVICE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "API-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='EcsServiceName'].OutputValue" \
            --output text)

          if [[ -n "$CLUSTER_NAME" && -n "$SERVICE_NAME" ]]; then
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SERVICE_NAME" \
              --force-new-deployment

            # Wait for service to stabilize
            aws ecs wait services-stable \
              --cluster "$CLUSTER_NAME" \
              --services "$SERVICE_NAME"
          fi

  # ============================================
  # STEP 5: Deploy Frontend to S3 (Web Stack)
  # ============================================
  deploy-frontend:
    name: Deploy Frontend Assets
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-stacks]
    if: |
      github.event_name != 'pull_request' &&
      (needs.detect-changes.outputs.web-changed == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main') &&
      contains(needs.detect-changes.outputs.stack-matrix, 'web')
    environment: ${{ needs.detect-changes.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend dependencies
        run: |
          pnpm --filter=@postolio/csrf-client build || true
          pnpm --filter=@postolio/errors build || true
          pnpm --filter=@postolio/database build || true

      - name: Build frontend
        working-directory: packages/apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_FACEBOOK_APP_ID: ${{ vars.VITE_FACEBOOK_APP_ID }}
          VITE_FEATURE_AI_SUGGESTIONS: ${{ vars.VITE_FEATURE_AI_SUGGESTIONS }}
          VITE_FEATURE_VIDEO_SUPPORT: ${{ vars.VITE_FEATURE_VIDEO_SUPPORT }}
          VITE_ENVIRONMENT: ${{ needs.detect-changes.outputs.environment }}
        run: pnpm build

      - name: Deploy to S3
        working-directory: packages/apps/web
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "Web-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)

          if [[ -z "$BUCKET_NAME" ]]; then
            echo "Error: Frontend bucket not found"
            exit 1
          fi

          # Sync static assets with cache
          aws s3 sync dist/ s3://$BUCKET_NAME/ \
            --delete \
            --exclude "index.html" \
            --exclude "*.js.map" \
            --cache-control "public, max-age=31536000, immutable"

          # Upload index.html without cache
          aws s3 cp dist/index.html s3://$BUCKET_NAME/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "Web-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          if [[ -n "$DISTRIBUTION_ID" ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          fi

  # ============================================
  # STEP 6: Deployment Summary
  # ============================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-stacks, deploy-frontend]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Generate deployment report
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Stack-Based Deployment Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📍 Environment: ${{ needs.detect-changes.outputs.environment }}"
          echo "🔄 Commit: ${{ github.sha }}"
          echo ""
          echo "📦 Deployed Stacks:"
          STACKS="${{ needs.detect-changes.outputs.stack-matrix }}"
          if [[ "$STACKS" != "[]" ]]; then
            echo "$STACKS" | jq -r '.[] | "  ✅ " + . + " Stack"'
          else
            echo "  ℹ️  No stacks deployed (no changes detected)"
          fi
          echo ""
          echo "🔗 Application URL: ${{ vars.VITE_API_URL }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send deployment notification
        if: needs.detect-changes.outputs.environment == 'prod' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const stacks = JSON.parse('${{ needs.detect-changes.outputs.stack-matrix }}');
            const stackList = stacks.map(stack => `- ${stack} Stack`).join('\n');

            const summary = `
            ## 🚀 Production Deployment Complete (Stack-Based)

            **Environment:** ${{ needs.detect-changes.outputs.environment }}
            **Commit:** ${{ github.sha }}
            **Deployed by:** ${{ github.actor }}

            ### Deployed Stacks:
            ${stackList || '- No stacks deployed'}

            ### Architecture Improvement:
            ✅ Deployed using optimized stack-based architecture
            ✅ Reduced deployment complexity from 8+ microservices to ${stacks.length} logical stacks
            ✅ Improved deployment reliability and consistency
            `;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.sha }}',
              body: summary
            });