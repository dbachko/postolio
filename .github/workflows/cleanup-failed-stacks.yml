name: Cleanup Failed Stacks

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to cleanup'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      stack_name:
        description: 'Specific stack name to cleanup (optional, leave empty for all failed)'
        required: false
        type: string
      confirm_deletion:
        description: 'Type "DELETE" to confirm stack deletion'
        required: true
        type: string
      allow_prod_cleanup:
        description: 'Allow cleanup in prod environment (default: false)'
        required: false
        type: boolean
        default: false
      allow_data_stack_deletion:
        description: 'Allow deleting data-owning stacks (Foundation/AssetLibrary) (default: false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  cleanup:
    name: Cleanup Failed Stacks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deletion }}" != "DELETE" ]; then
            echo "❌ Deletion not confirmed. Please type 'DELETE' in the confirmation field."
            exit 1
          fi

          if [ "${{ github.event.inputs.environment }}" = "prod" ] && [ "${{ github.event.inputs.allow_prod_cleanup }}" != "true" ]; then
            echo "❌ Prod cleanup is blocked by default."
            echo "Set allow_prod_cleanup=true to proceed."
            exit 1
          fi

          echo "✅ Deletion confirmed"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: List and cleanup failed stacks
        run: |
          ENV="${{ github.event.inputs.environment }}"
          SPECIFIC_STACK="${{ github.event.inputs.stack_name }}"
          ALLOW_DATA_STACK_DELETION="${{ github.event.inputs.allow_data_stack_deletion }}"

          echo "🔍 Scanning for failed stacks in environment: $ENV"

          # Get all Postolio stacks in failed states
          FAILED_STACKS=$(aws cloudformation describe-stacks \
            --query "Stacks[?starts_with(StackName, 'Postolio-') && ends_with(StackName, '-$ENV') && (StackStatus == 'ROLLBACK_COMPLETE' || StackStatus == 'CREATE_FAILED' || StackStatus == 'UPDATE_ROLLBACK_COMPLETE')].StackName" \
            --output text)

          if [ -n "$SPECIFIC_STACK" ]; then
            # Check if specific stack exists and is in failed state
            STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$SPECIFIC_STACK" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            
            if [ "$STACK_STATUS" = "DOES_NOT_EXIST" ]; then
              echo "❌ Stack $SPECIFIC_STACK does not exist"
              exit 1
            elif [[ "$STACK_STATUS" =~ ^(ROLLBACK_COMPLETE|CREATE_FAILED|UPDATE_ROLLBACK_COMPLETE)$ ]]; then
              echo "🎯 Cleaning up specific stack: $SPECIFIC_STACK (Status: $STACK_STATUS)"
              FAILED_STACKS="$SPECIFIC_STACK"
            else
              echo "❌ Stack $SPECIFIC_STACK is not in a failed state (Status: $STACK_STATUS)"
              exit 1
            fi
          fi

          if [ -z "$FAILED_STACKS" ]; then
            echo "✅ No failed stacks found in environment $ENV"
            exit 0
          fi

          echo "🧹 Found failed stacks to cleanup:"
          for stack in $FAILED_STACKS; do
            echo "  - $stack"
          done

          # Delete each failed stack
          for stack in $FAILED_STACKS; do
            # Guardrail: block deletion of stacks that may own persistent databases/storage
            if [[ "$stack" == Postolio-Foundation-* || "$stack" == Postolio-AssetLibrary-* ]]; then
              if [[ "$ALLOW_DATA_STACK_DELETION" != "true" ]]; then
                echo "❌ Refusing to delete data-owning stack: $stack"
                echo "Set allow_data_stack_deletion=true only after explicit backup/snapshot verification."
                exit 1
              fi
            fi

            echo ""
            echo "🗑️  Deleting stack: $stack"
            
            # Get stack events for debugging
            echo "📋 Recent stack events:"
            aws cloudformation describe-stack-events \
              --stack-name "$stack" \
              --max-items 5 \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceStatusReason]' \
              --output table || true
            
            # Delete the stack
            aws cloudformation delete-stack --stack-name "$stack"
            echo "✅ Deletion initiated for $stack"
          done

          # Wait for all deletions to complete
          echo ""
          echo "⏳ Waiting for stack deletions to complete..."
          for stack in $FAILED_STACKS; do
            echo "Waiting for $stack deletion..."
            aws cloudformation wait stack-delete-complete \
              --stack-name "$stack" \
              --cli-read-timeout 0 \
              --cli-connect-timeout 60 || {
              echo "⚠️ Warning: Deletion wait failed or timed out for $stack"
            }
          done

          echo ""
          echo "🎉 Cleanup completed!"

      - name: Verify cleanup
        run: |
          ENV="${{ github.event.inputs.environment }}"

          echo "🔍 Verifying cleanup results..."
          REMAINING_FAILED=$(aws cloudformation describe-stacks \
            --query "Stacks[?starts_with(StackName, 'Postolio-') && ends_with(StackName, '-$ENV') && (StackStatus == 'ROLLBACK_COMPLETE' || StackStatus == 'CREATE_FAILED' || StackStatus == 'UPDATE_ROLLBACK_COMPLETE')].StackName" \
            --output text)

          if [ -z "$REMAINING_FAILED" ]; then
            echo "✅ All failed stacks have been cleaned up successfully"
          else
            echo "⚠️ Some failed stacks still remain:"
            for stack in $REMAINING_FAILED; do
              echo "  - $stack"
            done
          fi
