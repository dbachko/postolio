name: 'CDK Setup'
description: 'Common setup steps for CDK deployments'
inputs:
  aws-access-key-id:
    description: 'AWS Access Key ID'
    required: true
  aws-secret-access-key:
    description: 'AWS Secret Access Key'
    required: true
  aws-region:
    description: 'AWS Region'
    required: false
    default: 'us-east-1'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10.19.0'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Install all workspace dependencies
      run: |
        echo "Installing workspace dependencies..."
        pnpm install --frozen-lockfile --prefer-offline
        echo "Dependencies installed successfully"
      shell: bash

    - name: Build dependencies
      run: |
        echo "Building required dependencies for CDK deployment..."

        # Build required dependencies for CDK deployment with error handling
        echo "Building service-parameters..."
        pnpm --filter=@postolio/service-parameters build

        echo "Building database (may fail, continuing)..."
        pnpm --filter=@postolio/database build || {
          echo "Database build failed, continuing without it..."
        }

        echo "Building errors..."
        pnpm --filter=@postolio/errors build

        echo "Building AWS utilities..."
        pnpm --filter=@postolio/aws build

        echo "All dependency builds completed"
      shell: bash
