<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No image placeholder (brand)">
  <defs>
    <!-- Subtle radial for depth inside the dot -->
    <radialGradient id="dotFill" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#ECEFF3"/>
    </radialGradient>
  </defs>

  <!-- Soft gray circular badge -->
  <circle cx="256" cy="256" r="140" fill="url(#dotFill)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Brand mark: stylized P + four dots (monochrome), precisely centered -->
  <g transform="translate(256,256) scale(1.05) translate(-128,-128)">
    <!-- P letter -->
    <path fill="#6B7280" d="M 60 60 L 60 196 L 92 196 L 92 140 L 140 140 C 168 140 188 120 188 92 C 188 64 168 44 140 44 L 60 44 Z M 92 76 L 140 76 C 150 76 156 82 156 92 C 156 102 150 108 140 108 L 92 108 Z"/>
    <!-- Grid dots -->
    <circle cx="164" cy="164" r="8" fill="#6B7280" opacity="0.9"/>
    <circle cx="196" cy="164" r="8" fill="#6B7280" opacity="0.9"/>
    <circle cx="164" cy="196" r="8" fill="#6B7280" opacity="0.9"/>
    <circle cx="196" cy="196" r="8" fill="#6B7280" opacity="0.9"/>
  </g>
</svg>
